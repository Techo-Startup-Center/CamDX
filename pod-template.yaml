apiVersion: v1
kind: Pod
metadata:
  labels:
    some-label: jenkins-dind-agent
spec:
  hostAliases:
    - ip: 10.10.40.237
      hostnames:
        - artifactory-registry-dev.techostartup.center
        - container-registry-dev.techostartup.center
  containers:
    - name: jnlp
      image: jenkins/inbound-agent:latest
      tty: true
    - name: docker
      image: docker:28-dind
      securityContext:
        privileged: true
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run
        - name: docker-cache
          mountPath: /var/lib/docker  # Mount the PVC here
    - name: docker-cli
      image: docker:28-cli
      command: ["cat"]
      tty: true
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run
  volumes:
    - name: docker-socket
      emptyDir: {}

    - name: docker-cache
      persistentVolumeClaim:
        claimName: jenkins-agent-docker-build-cache-pvc  # Ensure this PVC exists
